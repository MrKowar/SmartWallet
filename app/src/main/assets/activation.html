<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>SmartWallet — активация</title>
  <style>
    :root{
      --bg:#070D24;
      --surface:#121E45;
      --surface-2:#18275A;
      --line:rgba(77,155,255,.14);
      --line-strong:rgba(77,155,255,.32);
      --text:#EAF0FF;
      --text-soft:#8A9BC7;
      --text-dim:#5D6E9C;
      --accent:#2F7BFF;
      --accent-2:#4D9BFF;
      --accent-glow:rgba(47,123,255,.45);
      --orange:#FF7A1A;
      --orange-2:#FFA142;
      --orange-glow:rgba(255,122,26,.40);
      --income:#2EE59D;
      --danger:#FF5C7A;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg);}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
      background:
        radial-gradient(120% 60% at 0% 0%, rgba(47,123,255,.25), transparent 55%),
        radial-gradient(90% 50% at 100% 100%, rgba(255,122,26,.14), transparent 60%),
        var(--bg);
      background-attachment:fixed;
      color:var(--text);
      min-height:100vh;
      padding:36px 16px 32px;
      -webkit-tap-highlight-color:transparent;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    @keyframes glowPulse{
      0%,100%{box-shadow:0 10px 28px var(--orange-glow);}
      50%{box-shadow:0 10px 40px rgba(255,122,26,.65);}
    }
    .wrap{max-width:440px;margin:0 auto;}
    .wrap > *{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
    .wrap > *:nth-child(2){animation-delay:.05s;}
    .wrap > *:nth-child(3){animation-delay:.10s;}
    .wrap > *:nth-child(4){animation-delay:.15s;}
    .wrap > *:nth-child(5){animation-delay:.20s;}

    .hero{text-align:center;margin-bottom:22px;}
    .logo{
      width:72px;height:72px;margin:0 auto 16px;border-radius:22px;
      background:linear-gradient(135deg,var(--accent-2),var(--accent) 55%,#1747C9);
      display:flex;align-items:center;justify-content:center;
      font-size:24px;font-weight:800;color:#fff;
      box-shadow:0 12px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .hero h1{
      font-size:26px;font-weight:800;letter-spacing:-.02em;
      background:linear-gradient(90deg,#FFFFFF 0%,#A9C8FF 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .status{
      display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;
      font-size:13px;font-weight:700;
      background:rgba(255,122,26,.14);color:var(--orange-2);border:1px solid rgba(255,122,26,.32);
    }
    .status.ok{background:rgba(46,229,157,.14);color:var(--income);border-color:rgba(46,229,157,.32);}
    .status.bad{background:rgba(255,92,122,.14);color:var(--danger);border-color:rgba(255,92,122,.32);}

    .card{
      background:linear-gradient(180deg,var(--surface) 0%,#0F1A3D 100%);
      border:1px solid var(--line);border-radius:24px;
      box-shadow:0 12px 32px rgba(0,0,0,.35);
      padding:20px 18px;margin-bottom:14px;
    }
    .label{
      font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:var(--text-soft);margin-bottom:10px;
    }
    .code-row{display:flex;gap:10px;align-items:stretch;}
    .code{
      flex:1;display:flex;align-items:center;justify-content:center;
      font-family:'SF Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:.08em;
      background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:16px;
      padding:14px 8px;color:#fff;user-select:all;
    }
    .icon-btn{
      width:56px;border:none;border-radius:16px;cursor:pointer;font-size:20px;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;
      box-shadow:0 8px 20px var(--accent-glow);
      transition:transform .15s ease;
    }
    .icon-btn:active{transform:scale(.92);}

    .steps{list-style:none;counter-reset:s;}
    .steps li{
      counter-increment:s;position:relative;padding:8px 0 8px 40px;
      font-size:14px;line-height:1.4;color:var(--text);
    }
    .steps li::before{
      content:counter(s);position:absolute;left:0;top:6px;
      width:28px;height:28px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,var(--orange-2),var(--orange));
    }
    .steps li span{color:var(--text-soft);}

    textarea{
      width:100%;min-height:96px;resize:none;
      background:var(--bg);border:2px solid var(--line);border-radius:16px;
      color:var(--text);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.45;
      padding:12px 14px;outline:none;word-break:break-all;
      transition:border-color .2s, box-shadow .2s;
    }
    textarea::placeholder{color:var(--text-dim);}
    textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,123,255,.20);}
    .paste{
      margin-top:8px;background:none;border:none;color:var(--accent-2);
      font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;
    }
    .msg{min-height:20px;margin-top:8px;font-size:13px;font-weight:600;}
    .msg.err{color:var(--danger);}
    .msg.ok{color:var(--income);}

    .btn{
      width:100%;padding:16px;border:none;border-radius:18px;cursor:pointer;
      font-size:16px;font-weight:800;color:#fff;margin-top:10px;
      transition:transform .15s ease;
    }
    .btn:active{transform:scale(.97);}
    .btn:disabled{opacity:.6;pointer-events:none;}
    .btn-blue{background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 10px 24px var(--accent-glow);}
    .btn-orange{
      background:linear-gradient(135deg,var(--orange-2),var(--orange));
      animation:glowPulse 2.8s ease-in-out infinite;
    }
    .btn-ghost{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--line);}
    .hidden{display:none;}

    /* ===== Полировка: нативное поведение и моушен ===== */
    :root{
      --ease-out-strong:cubic-bezier(0.23, 1, 0.32, 1);
    }
    html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
    body{
      min-height:100dvh;
      padding:calc(32px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing:antialiased;
    }
    button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:inherit;}
    textarea{font-size:15px;}

    /* Экран видят редко — здесь уместен короткий каскад, но без «плавающих» 450 мс */
    .wrap > *{animation:act-in 420ms var(--ease-out-strong) backwards;}
    .wrap > *:nth-child(2){animation-delay:50ms;}
    .wrap > *:nth-child(3){animation-delay:100ms;}
    .wrap > *:nth-child(4){animation-delay:150ms;}
    .wrap > *:nth-child(5){animation-delay:200ms;}
    @keyframes act-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

    .card{
      border-color:rgba(255,255,255,.07);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 32px -14px rgba(0,0,0,.6);
    }
    .logo{box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 18px 36px -16px var(--accent-glow);}
    .code{font-variant-numeric:tabular-nums;}

    /* Без бесконечной пульсации — статичное мягкое свечение */
    .btn-orange{animation:none;box-shadow:0 14px 28px -14px var(--orange-glow);}
    .btn-blue{box-shadow:0 14px 28px -14px var(--accent-glow);}
    .btn,.icon-btn,.paste{transition:transform 160ms var(--ease-out-strong);}
    .btn:active,.icon-btn:active,.paste:active{transform:scale(.97);}
    .msg{transition:opacity 200ms ease;}

    @media (prefers-reduced-motion: reduce){
      .wrap > *{animation:act-fade 200ms ease backwards;}
      @keyframes act-fade{from{opacity:0;}to{opacity:1;}}
      .btn:active,.icon-btn:active,.paste:active{transform:none;}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">SW</div>
    <h1>SmartWallet</h1>
    <div class="status" id="status">Загрузка…</div>
  </div>

  <div class="card">
    <div class="label">Код вашего устройства</div>
    <div class="code-row">
      <div class="code" id="device-code">—</div>
      <button class="icon-btn" onclick="copyCode()" aria-label="Скопировать код">📋</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Как получить ключ</div>
    <ol class="steps">
      <li>Скопируйте код устройства <span>— кнопка 📋 выше</span></li>
      <li>Откройте нашу группу в Telegram</li>
      <li>Отправьте код и оплатите доступ <span>— ключ придёт в ответ</span></li>
      <li>Вставьте ключ ниже и нажмите «Активировать»</li>
    </ol>
    <button class="btn btn-orange" onclick="openBuy()">✈️ Купить в Telegram</button>
  </div>

  <div class="card">
    <div class="label">Ключ активации</div>
    <textarea id="key-input" placeholder="SW-… или SWT-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="paste" onclick="pasteKey()">📥 Вставить из буфера</button>
    <div class="msg" id="msg"></div>
    <button class="btn btn-blue" id="activate-btn" onclick="activate()">Активировать</button>
  </div>

  <button class="btn btn-ghost hidden" id="trial-btn" onclick="continueTrial()"></button>
</div>

<script>
  const bridge = window.License;

  function daysWord(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'день';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'дня';
    return 'дней';
  }

  function render() {
    const state = JSON.parse(bridge.getState());
    document.getElementById('device-code').textContent = state.deviceCode;

    const status = document.getElementById('status');
    const trialBtn = document.getElementById('trial-btn');
    status.className = 'status';
    trialBtn.classList.add('hidden');

    if (state.status === 'trial') {
      status.textContent = `Пробный период: ещё ${state.daysLeft} ${daysWord(state.daysLeft)}`;
      trialBtn.textContent = 'Продолжить бесплатно';
      trialBtn.classList.remove('hidden');
    } else if (state.status === 'trial_expired') {
      status.className = 'status bad';
      status.textContent = 'Пробный период закончился';
    } else if (state.status === 'license_expired') {
      status.className = 'status bad';
      status.textContent = 'Срок действия ключа истёк';
    } else if (state.status === 'licensed') {
      status.className = 'status ok';
      status.textContent = 'Активировано';
    }
  }

  function showMsg(text, ok) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  function copyCode() { bridge.copyDeviceCode(); }
  function openBuy() { bridge.openBuy(); }
  function continueTrial() { bridge.continueTrial(); }

  function pasteKey() {
    const text = bridge.readClipboard();
    if (text) document.getElementById('key-input').value = text.trim();
    else showMsg('Буфер обмена пуст', false);
  }

  // Сервер тестовых кодов SWT-… (tools/license-server). Обычные ключи SW-… проверяются без интернета
  const LICENSE_SERVER = 'https://smartwallet-license.alex2003prokopenko.workers.dev';

  async function activate() {
    const key = document.getElementById('key-input').value.trim();
    if (!key) { showMsg('Вставьте ключ активации', false); return; }
    if (/^SWT/i.test(key.replace(/\s+/g, ''))) { await redeemCode(key); return; }
    const result = JSON.parse(bridge.activate(key));
    showMsg(result.message, result.ok);
  }

  /** Код SWT-… обменивается на сервере на ключ SW-…, привязанный к этому телефону. */
  async function redeemCode(code) {
    const btn = document.getElementById('activate-btn');
    btn.disabled = true;
    showMsg('Проверяю код…', true);
    try {
      const device = JSON.parse(bridge.getState()).deviceCode;
      const res = await fetch(LICENSE_SERVER + '/redeem', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code, device })
      });
      const data = await res.json();
      if (!data.ok || !data.key) { showMsg(data.message || 'Код не подошёл', false); return; }
      const result = JSON.parse(bridge.activate(data.key));
      showMsg(result.message, result.ok);
    } catch (e) {
      showMsg('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз', false);
    } finally {
      btn.disabled = false;
    }
  }

  render();
</script>
</body>
</html>
